[tool.poetry]
name = "truthfulness-evaluator"
version = "0.1.0"
description = "Multi-model truthfulness evaluation with filesystem-aware evidence gathering"
authors = ["John Sosoka"]
readme = "README.md"
license = "GPL-3.0-or-later"
homepage = "https://sosoka-labs.github.io/truthfulness-evaluator/"
repository = "https://github.com/Sosoka-Labs/truthfulness-evaluator"
keywords = ["llm", "fact-checking", "truthfulness", "verification", "langgraph", "langchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
packages = [{include = "truthfulness_evaluator", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
langgraph = "^1.0.0"
langchain = "^1.0.0"
langchain-openai = "^0.3.0"
langchain-anthropic = "^0.3.0"
langchain-fireworks = "^1.0.0"
langchain-community = "^0.3.0"
pydantic = "^2.0"
pydantic-settings = "^2.0"
rich = "^13.0"
typer = ">=0.12,<1.0"
python-dotenv = "^1.0.0"
requests = "^2.31"
beautifulsoup4 = "^4.12"
jinja2 = "^3.1"
duckduckgo-search = "^8.1.1"
ddgs = "^9.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^1.0"
pytest-cov = "^5.0"
pytest-mock = "^3.14"
black = "^24.0"
ruff = "^0.5.0"
mypy = "^1.10"

[tool.poetry.scripts]
truth-eval = "truthfulness_evaluator.truth:app"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6"
mkdocs-material = "^9.5"
mkdocstrings = {extras = ["python"], version = "^0.25"}
mkdocs-autorefs = ">=0.5,<1.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
# py314 target lands with black 25+; the current pin formats identically for it.
target-version = ['py311', 'py312', 'py313']

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not e2e' --cov=truthfulness_evaluator --cov-report=term-missing"
markers = [
    "e2e: end-to-end tests requiring real LLM API keys",
    "slow: tests that take more than 5 seconds",
]
# Quiet unavoidable third-party deprecation noise so first-party signal is visible.
filterwarnings = [
    "ignore:.*Pydantic V1 style.*:DeprecationWarning",
    "ignore:.*Core Pydantic V1 functionality.*:UserWarning",
    "ignore::DeprecationWarning:fireworks.*",
    "ignore::DeprecationWarning:langchain_core.*",
    "ignore::DeprecationWarning:pytest_asyncio.*",
]

[tool.coverage.run]
source = ["truthfulness_evaluator"]
branch = true

[tool.coverage.report]
show_missing = true
